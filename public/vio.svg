<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 220 250"
  width="220"
  height="250"
  role="img"
  aria-label="Vio"
>
  <defs>
    <!-- Body: violet → magenta -->
    <linearGradient id="vio-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B12D4" />
      <stop offset="45%" stop-color="#A015E0" />
      <stop offset="100%" stop-color="#D12BC8" />
    </linearGradient>

    <!-- Soft top-left specular -->
    <radialGradient id="vio-spec" cx="32%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom body shade -->
    <radialGradient id="vio-shade" cx="50%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#3A0070" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3A0070" stop-opacity="0" />
    </radialGradient>

    <!-- Face panel -->
    <linearGradient id="vio-face" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2A1638" />
      <stop offset="55%" stop-color="#160F20" />
      <stop offset="100%" stop-color="#0C0814" />
    </linearGradient>

    <linearGradient id="vio-face-sheen" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Eyes / mouth -->
    <linearGradient id="vio-glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0D4FF" />
    </linearGradient>

    <!-- Antenna tip glow -->
    <radialGradient id="vio-tip" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8FF" />
      <stop offset="40%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#C81FC0" stop-opacity="0" />
    </radialGradient>

    <!-- Cheek blush -->
    <radialGradient id="vio-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6BD6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FF6BD6" stop-opacity="0" />
    </radialGradient>

    <!-- Foot shadow -->
    <radialGradient id="vio-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A0A4A" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#2A0A4A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2A0A4A" stop-opacity="0" />
    </radialGradient>

    <filter id="vio-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" />
    </filter>

    <style>
      <![CDATA[
        @keyframes vio-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }
        @keyframes vio-wave {
          0%, 100% { transform: rotate(0deg); }
          50% { transform: rotate(14deg); }
        }
        @keyframes vio-blink {
          0%, 92%, 100% { transform: scaleY(1); }
          96% { transform: scaleY(0.12); }
        }
        @keyframes vio-twinkle {
          0%, 100% { opacity: 0.35; transform: scale(0.85); }
          50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes vio-tip-pulse {
          0%, 100% { opacity: 0.75; }
          50% { opacity: 1; }
        }
        .vio-body {
          transform-origin: 110px 150px;
          animation: vio-float 3.2s ease-in-out infinite;
        }
        .vio-wave {
          transform-origin: 162px 124px;
          animation: vio-wave 1.5s ease-in-out infinite;
        }
        .vio-blink {
          transform-origin: 110px 111px;
          animation: vio-blink 4.5s ease-in-out infinite;
        }
        .vio-twinkle {
          transform-origin: 184px 60px;
          animation: vio-twinkle 2.4s ease-in-out infinite;
        }
        .vio-tip {
          animation: vio-tip-pulse 2s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
          .vio-body, .vio-wave, .vio-blink, .vio-twinkle, .vio-tip {
            animation: none !important;
          }
        }
      ]]>
    </style>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="110" cy="228" rx="54" ry="11" fill="url(#vio-shadow)" />

  <g class="vio-body">
    <!-- Feet -->
    <ellipse cx="94" cy="204" rx="16" ry="9" fill="url(#vio-body)" />
    <ellipse cx="126" cy="204" rx="16" ry="9" fill="url(#vio-body)" />
    <ellipse cx="90" cy="201" rx="6" ry="3" fill="#ffffff" opacity="0.18" />
    <ellipse cx="122" cy="201" rx="6" ry="3" fill="#ffffff" opacity="0.18" />

    <!-- Left arm (resting) -->
    <path
      d="M58,128 Q42,150 47,172"
      fill="none"
      stroke="url(#vio-body)"
      stroke-width="12"
      stroke-linecap="round"
    />
    <circle cx="47" cy="172" r="9" fill="url(#vio-body)" />
    <circle cx="45" cy="169" r="3" fill="#ffffff" opacity="0.22" />

    <!-- Right arm (waving) -->
    <g class="vio-wave">
      <path
        d="M162,124 Q186,104 182,82"
        fill="none"
        stroke="url(#vio-body)"
        stroke-width="12"
        stroke-linecap="round"
      />
      <circle cx="182" cy="82" r="9" fill="url(#vio-body)" />
      <circle cx="180" cy="79" r="3" fill="#ffffff" opacity="0.22" />
    </g>

    <!-- Body -->
    <path
      d="M96,52 L124,52 Q166,52 166,94 L166,156 Q166,198 124,198 L96,198 Q54,198 54,156 L54,94 Q54,52 96,52 Z"
      fill="url(#vio-body)"
    />
    <path
      d="M96,52 L124,52 Q166,52 166,94 L166,156 Q166,198 124,198 L96,198 Q54,198 54,156 L54,94 Q54,52 96,52 Z"
      fill="url(#vio-shade)"
    />
    <ellipse cx="92" cy="100" rx="38" ry="48" fill="url(#vio-spec)" />

    <!-- Belt / chest details -->
    <path
      d="M73,150 Q110,160 147,150"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.2"
      stroke-width="2.4"
      stroke-linecap="round"
    />
    <path
      d="M113,165 L104,173 L113,181"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.32"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M122,167.5 L127.5,173 L122,178.5 L116.5,173 Z"
      fill="#ffffff"
      fill-opacity="0.32"
    />
    <path
      d="M70,175.6 L72.4,178 L70,180.4 L67.6,178 Z"
      fill="#ffffff"
      fill-opacity="0.2"
    />
    <path
      d="M150,175.6 L152.4,178 L150,180.4 L147.6,178 Z"
      fill="#ffffff"
      fill-opacity="0.2"
    />

    <!-- Antenna -->
    <line
      x1="110"
      y1="52"
      x2="110"
      y2="30"
      stroke="url(#vio-body)"
      stroke-width="5"
      stroke-linecap="round"
    />
    <circle class="vio-tip" cx="110" cy="18" r="14" fill="url(#vio-tip)" filter="url(#vio-soft)" />
    <path d="M110,8 L121,19 L110,30 L99,19 Z" fill="url(#vio-body)" />
    <path d="M110,12 L116,18 L110,24 L104,18 Z" fill="#ffffff" opacity="0.35" />

    <!-- Face panel -->
    <rect x="63" y="80" width="94" height="64" rx="30" ry="30" fill="url(#vio-face)" />
    <rect
      x="63"
      y="80"
      width="94"
      height="30"
      rx="22"
      fill="url(#vio-face-sheen)"
    />
    <!-- Inner rim -->
    <rect
      x="67"
      y="84"
      width="86"
      height="56"
      rx="26"
      ry="26"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.08"
      stroke-width="1.5"
    />

    <!-- Soft blush -->
    <ellipse cx="78" cy="124" rx="10" ry="6" fill="url(#vio-blush)" />
    <ellipse cx="142" cy="124" rx="10" ry="6" fill="url(#vio-blush)" />

    <!-- Eyes -->
    <g class="vio-blink">
      <path
        d="M84,111 Q94,98 104,111"
        fill="none"
        stroke="url(#vio-glow)"
        stroke-width="6"
        stroke-linecap="round"
      />
      <path
        d="M116,111 Q126,98 136,111"
        fill="none"
        stroke="url(#vio-glow)"
        stroke-width="6"
        stroke-linecap="round"
      />
    </g>

    <!-- Smile -->
    <path d="M99,128 Q110,141 121,128 Z" fill="url(#vio-glow)" />
    <ellipse cx="110" cy="132" rx="5" ry="2.5" fill="#C81FC0" opacity="0.35" />

    <!-- Sparkle -->
    <path
      class="vio-twinkle"
      d="M184,55 L189,60 L184,65 L179,60 Z"
      fill="#E879F9"
    />
    <path
      class="vio-twinkle"
      d="M36,72 L39,75 L36,78 L33,75 Z"
      fill="#E879F9"
      opacity="0.7"
      style="animation-delay: 0.6s"
    />
  </g>
</svg>
